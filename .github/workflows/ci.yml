name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # Os testes usam provedores falsos (tests/fakes.py), então as chaves são só para a config carregar
      - name: Testes
        env:
          ANTHROPIC_API_KEY: chave-falsa-para-ci
          DEEPGRAM_API_KEY: chave-falsa-para-ci
          ELEVENLABS_API_KEY: chave-falsa-para-ci
          ELEVENLABS_VOICE_ID: voz-falsa-para-ci
        run: pytest -q
